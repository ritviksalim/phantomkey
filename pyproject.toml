[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantomkey"
version = "0.1.0"
description = "AI-native password manager for AI agents — blind credential injection"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "mcp>=1.20",
    "keyring>=25.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
]

[project.scripts]
phantomkey = "phantomkey.cli:app"
phantomkey-mcp = "phantomkey.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phantomkey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
