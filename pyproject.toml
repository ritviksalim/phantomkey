[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantomkey"
version = "0.1.0"
description = "AI-native password manager for AI agents — blind credential injection"
readme = "README.md"
license = "LicenseRef-PhantomKey-Source-Available-1.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ritvik Salim", email = "ritviksalim@gmail.com" },
]
keywords = ["mcp", "password-manager", "ai-agents", "llm", "credentials", "security", "vault"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "mcp>=1.20",
    "keyring>=25.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
phantomkey = "phantomkey.cli:app"
phantomkey-mcp = "phantomkey.mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/ritviksalim/phantomkey"
Repository = "https://github.com/ritviksalim/phantomkey"
Issues = "https://github.com/ritviksalim/phantomkey/issues"
Changelog = "https://github.com/ritviksalim/phantomkey/blob/main/CHANGELOG.md"
"Threat model" = "https://github.com/ritviksalim/phantomkey/blob/main/docs/threat-model.md"

[tool.hatch.build.targets.wheel]
packages = ["src/phantomkey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
